name: PR

# A pull request must build the site strictly; a broken link or an orphaned page fails it.
on:
  pull_request:

jobs:
  build:
    name: Site builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs-requirements.txt

      - name: Install site toolchain
        run: make install

      - name: Build site
        run: make build
