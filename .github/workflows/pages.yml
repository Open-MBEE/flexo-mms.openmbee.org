name: Pages

# The site is docs/ rendered by MkDocs, republished on every push to develop.
# --strict: a broken link fails the deployment.
on:
  push:
    branches: [develop]
  workflow_dispatch:

# One deployment at a time; cancelling one in flight would leave the site behind.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Site
    # Published from Open-MBEE/flexo.openmbee.org; a fork would deploy the same pages under its own domain.
    if: github.repository == 'Open-MBEE/flexo.openmbee.org'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs-requirements.txt

      - name: Install site toolchain
        run: make install

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: make build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
